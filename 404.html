<!DOCTYPE html>

<html data-i18n-title="title9b5aa443" lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Page introuvable — ParkTracker</title>
<meta content="noindex" name="robots"/>
<meta content="#0F1115" name="theme-color"/>
<link href="/assets/logo-dark-bg.png" rel="icon" type="image/png"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="/css/style.css" rel="stylesheet"/>
<style>
    .err-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }
    .err-code {
      font-size: clamp(5rem, 18vw, 11rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      background: linear-gradient(120deg, var(--accent), #ff8a6b);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .err-wrap h1 {
      font-size: clamp(1.4rem, 4vw, 2.1rem);
      margin-bottom: 14px;
    }
    .err-wrap p {
      color: var(--text-muted);
      max-width: 460px;
      margin: 0 auto 30px;
    }
    .err-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
    }
    .err-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.1rem;
      margin-bottom: 34px;
    }
    .err-brand img { width: 32px; height: 32px; }
  </style>
</head>
<body>
<div class="err-wrap">
<a aria-label="ParkTracker — accueil" class="err-brand" href="/">
<img alt="" height="32" src="/assets/logo-mark.png" width="32"/>
<span class="brand-name">Park<span style="color:var(--accent)">Tracker</span></span>
</a>
<div class="err-code" data-i18n="t4f4adcbf8c">404</div>
<h1 data-i18n="t4a039e0abd">Cette page a quitté le parc</h1>
<p data-i18n="t6e540a806c">L'adresse demandée n'existe pas ou a été déplacée. Pas de panique, revenons à l'entrée.</p>
<div class="err-actions" data-i18n="tdf1afeba1d">
<a class="btn btn-primary" href="/">Retour à l'accueil</a>
<a class="btn btn-ghost" href="/assistance">Assistance</a>
</div>
</div>
<script src="/js/i18n.js"></script>
</body>
</html>
