<!DOCTYPE html>
<html data-i18n-title="ec_title" lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>E-mail confirmé — ParkTracker</title>
<meta content="noindex" name="robots"/>
<meta content="#0F1115" name="theme-color"/>
<link href="/assets/logo-dark-bg.png" rel="icon" type="image/png"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="/css/style.css" rel="stylesheet"/>
<style>
  .confirm-wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
  }
  .confirm-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 1.1rem;
    margin-bottom: 40px;
  }
  .confirm-brand img { width: 32px; height: 32px; }
  .confirm-badge {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: rgba(34, 197, 94, 0.14);
    border: 1px solid rgba(34, 197, 94, 0.4);
    margin-bottom: 28px;
  }
  .confirm-badge svg { width: 46px; height: 46px; stroke: #22c55e; }
  .confirm-wrap h1 {
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    margin-bottom: 12px;
  }
  .confirm-wrap p {
    color: var(--text-muted);
    font-size: 1.1rem;
    max-width: 420px;
    margin: 0 auto 30px;
  }
</style>
</head>
<body>
<div class="confirm-wrap">
<a class="confirm-brand" href="/" aria-label="ParkTracker — accueil">
<img alt="" height="32" src="/assets/logo-mark.png" width="32"/>
<span class="brand-name">Park<span style="color:var(--accent)">Tracker</span></span>
</a>
<div class="confirm-badge" aria-hidden="true">
<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
</div>
<h1 data-i18n="ec_h1">Ton e-mail est confirmé ✅</h1>
<p data-i18n="ec_p">Ouvre ParkTracker et connecte-toi.</p>
</div>
<script src="/js/i18n.js"></script>
</body>
</html>
